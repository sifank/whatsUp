<html lang="en">
<head>
    <meta cahrset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="icon" href="/static/favicon.ico">
    <title>DB Modify Object</title>
</head>
<body>

<form method="POST" action="/modifyok" onsubmit="return ConfirmModify();">

    <table>

        <tr>
            <th colspan="5">
                <h2 style="text-align: center;">
                    <span style="background-color: deepskyblue;">DB Add/Modify Object</span>
                </h2>
            </th>
        </tr>

        <!-- --------------- input ------------------------- -->
        <tr>
            <th>Name</th>
            <th>Common Name</th>
            <th>Image Location</th>
        </tr>
        <tr>
            <td>
                <input type="text" name="objectName" value="{{ SEL[2] }}">
                <input type="hidden" name="objectName_orig" value="{{ SEL[2] }}">
            </td>
            <td>
                <!-- Fixed: Closed hidden input tag properly -->
                <textarea name="commonName" rows="3" cols="50" style="background-color: white; color: black;">{{ SEL[3] }}</textarea>
                <input type="hidden" name="commonName_orig" value="{{ SEL[3] }}">
            </td>
            <td>
                <!-- Fixed: Closed hidden input tag properly -->
                <textarea name="imageLoc" rows="3" cols="50" style="background-color: white; color: black;">{{ SEL[10] }}</textarea>
                <input type="hidden" name="imageLoc_orig" value="{{ SEL[10] }}">
            </td>
        </tr>

        <tr>
            <th>RA</th>
            <th>DEC</th>
            <th>Type</th>
        </tr>
        <tr>
            <td>
                <input type="number" step="any" name="ra" value="{{ SEL[5] }}">
                <input type="hidden" name="ra_orig" value="{{ SEL[5] }}">
            </td>
            <td>
                <input type="number" step="any" name="dec" value="{{ SEL[6] }}">
                <input type="hidden" name="dec_orig" value="{{ SEL[6] }}">
            </td>
            <td>
                <select name='Type'>
                    <option value="{{ SEL[4] }}" selected disabled hidden>{{ DSO[SEL[4]] }}</option>
                    {% for item in DSO %}
                        <option value="{{ item }}" {% if value == SEL[4] %} selected {% endif %}>{{ DSO[item] }}</option>
                    {% endfor %}
                </select>
            </td>
        </tr>

        <tr>
            <th>Size</th>
            <th>PA</th>
            <th>visMag</th>
        </tr>
        <tr>
            <td>
                <input type="number" step="any" name="Size" value="{{ SEL[8] }}">
                <input type="hidden" name="Size_orig" value="{{ SEL[8] }}">
            </td>
            <td>
                <!-- Fixed: Removed duplicate closing </td> tag -->
                <input type="text" name="PA" value="{{ SEL[9] }}">
                <input type="hidden" name="PA_orig" value="{{ SEL[9] }}">
            </td>
            <td>
                <input type="number" step="any" name="mag" value="{{ SEL[7] }}">
                <input type="hidden" name="mag_orig" value="{{ SEL[7] }}">
            </td>
        </tr>

        <tr>
            <th>Priority</th>
            <td>
                <select name='Priority'>
                    <option value="{{ SEL[11] }}" selected disabled hidden>{{ SEL[11] }}</option>
                    {% for item in PF %}
                        <option value="{{ item }}">{{ item }}</option>
                    {% endfor %}
                </select>
            </td>
            <td></td>
            <td></td>
        </tr>
    </table>

    <!-- --------------- buttons ------------------------- -->
    <table class="short-table">
        <tr>
            <td>
                <input type="hidden" name="ID" value="{{ SEL[1] }}">
                <input type="hidden" name="Type_orig" value="{{ SEL[4] }}">
                <input type="hidden" name="Priority_orig" value="{{ SEL[11] }}">
                <input type="submit" value="Modify">
            </td>
</form>

        <form method="POST" action="/removeok" onsubmit="return ConfirmDelete();">
            <input type="hidden" name="ID" value= "{{ ID }}">
            <td><input type="submit" value="Remove"></td>
        </form>

        <form method="POST" action="/managedb">
            <td><input type="submit" name="action" value="Cancel" formnovalidate></td>
        </form>

        <form>
        <td><button onclick="history.back()" style="white-space: nowrap;">Go Back</button></td>
        </form>

    </tr></table>

    <!-- --------------- scripts ------------------------- -->
    <script>
        function ConfirmDelete() {
            var confirmation = confirm("Are you sure you want to permanently remove this record?");
            if (confirmation) {
                return true; // Proceed with form submission
            } else {
                return false; // Stop form submission
            }
        }
        function ConfirmModify() {
            var confirmation = confirm("Are you sure you want to modify this record?");
            if (confirmation) {
                return true; // Proceed with form submission
            } else {
                return false; // Stop form submission
            }
        }
    </script>

</body>
</html>
