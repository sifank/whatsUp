<VirtualHost *:5004>
    ServerName depoe

    WSGIDaemonProcess whatsUp processes=1 threads=15
    WSGIScriptAlias / /var/www/whatsUp/whatsUp.wsgi

    <Directory /var/www/whatsUp>
        WSGIProcessGroup session
        WSGIApplicationGroup %{GLOBAL}
        Order deny,allow
        Allow from all
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>

